<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   DESIGN TOKENS
   Every value the UI uses lives here. Nothing below this block should
   hard-code a color, space, radius, shadow, or duration.
   ========================================================================= */
:root{
  /* Color — background & surfaces */
  --bg:#0a0a0b;
  --bg-secondary:#050506;
  --surface:#141416;
  --surface-elevated:#1c1c1f;

  /* Color — text */
  --text-primary:#f2f2f0;
  --text-secondary:#9a9a97;
  --text-muted:#5c5c59;

  /* Color — accent & semantic */
  --accent:#ff2a1f;
  --accent-hover:#ff4438;
  --accent-soft:rgba(255,42,31,0.14);
  --accent-soft-strong:rgba(255,42,31,0.28);
  --success:#4a9d6f;
  --warning:#e0a030;
  --danger:#ff2a1f;

  /* Color — structure */
  --border:#242426;
  --divider:#1b1b1d;
  --focus-ring:rgba(255,42,31,0.55);
  --hover-overlay:rgba(255,255,255,0.04);
  --selection:rgba(255,42,31,0.28);

  /* Typography */
  --font-display:'DotGothic16', monospace;
  --font-body:'JetBrains Mono', monospace;
  --text-xs:10px;
  --text-sm:11.5px;
  --text-base:12.5px;
  --text-md:13.5px;
  --text-lg:16px;
  --text-xl:22px;
  --text-display:26px;
  --leading:1.55;
  --tracking-label:0.14em;
  --tracking-tight:0.01em;

  /* Spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;

  /* Radius */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-full:999px;

  /* Shadow */
  --shadow-subtle:0 1px 2px rgba(0,0,0,0.35);
  --shadow-hover:0 6px 20px rgba(0,0,0,0.38);
  --shadow-floating:0 16px 44px rgba(0,0,0,0.48);
  --shadow-modal:0 24px 70px rgba(0,0,0,0.6);

  /* Motion */
  --ease:cubic-bezier(.4,0,.2,1);
  --dur-fast:120ms;
  --dur-normal:200ms;
  --dur-slow:320ms;
  --dur-theme:340ms;

  /* Layout */
  --rail-w:64px;
  --sidebar-w-expanded:216px;
}

/* =========================================================================
   RESET & BASE
   ========================================================================= */
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:var(--text-md);
  letter-spacing:var(--tracking-tight);
  -webkit-font-smoothing:antialiased;
  transition:background-color var(--dur-theme) var(--ease), color var(--dur-theme) var(--ease);
}
button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer;}
input,textarea{font-family:inherit; color:inherit;}
::selection{ background:var(--selection); color:#fff; }
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:var(--r-full);}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:var(--r-sm); }
a{color:inherit;}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* =========================================================================
   APP LAYOUT
   ========================================================================= */
.app{ display:flex; min-height:100vh; }

.sidebar-rail{ width:var(--rail-w); flex-shrink:0; }

.sidebar{
  position:fixed; top:0; left:0; bottom:0;
  width:var(--rail-w);
  display:flex; flex-direction:column; align-items:center;
  padding:var(--sp-5) 0 var(--sp-4);
  background:var(--bg-secondary);
  border-right:1px solid var(--divider);
  z-index:40;
  overflow:hidden;
  transition:width var(--dur-normal) var(--ease), box-shadow var(--dur-normal) var(--ease);
}
.sidebar:hover, .sidebar:focus-within{
  width:var(--sidebar-w-expanded);
  box-shadow:var(--shadow-floating);
}
.sidebar-logo{
  width:100%; display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-4) var(--sp-6); margin-bottom:var(--sp-3);
  border-bottom:1px solid var(--divider);
}
.logo-mark{
  width:20px; height:20px; flex-shrink:0; border-radius:6px;
  overflow:hidden; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform var(--dur-fast) var(--ease);
}
.logo-mark:hover{ transform:scale(1.1); }
.logo-mark:active{ transform:scale(0.92); }
.logo-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
.logo-word{
  font-family:var(--font-display); font-size:14px; letter-spacing:0.1em;
  background:linear-gradient(90deg, #3a5cff 0%, #2fa9ff 55%, #38e0ff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-transform:uppercase; white-space:nowrap; font-weight:600;
  opacity:0; transform:translateX(-4px);
  transition:opacity var(--dur-normal) var(--ease) var(--dur-fast), transform var(--dur-normal) var(--ease) var(--dur-fast);
}
.sidebar:hover .logo-word, .sidebar:focus-within .logo-word{ opacity:1; transform:none; }

.nav-group{ width:100%; display:flex; flex-direction:column; gap:var(--sp-1); padding:0 var(--sp-2); }
.nav-spacer{ flex:1; }
.nav-divider{ width:calc(100% - 16px); height:1px; background:var(--divider); margin:var(--sp-3) auto; }

.nav-item{
  width:100%; display:flex; align-items:center; gap:var(--sp-3);
  height:40px; padding:0 12px; border-radius:var(--r-md);
  color:var(--text-secondary);
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  white-space:nowrap;
}
.nav-item:hover{ background:var(--hover-overlay); color:var(--text-primary); }
.nav-item.active{ background:var(--accent); color:#fff; }
.nav-item.active:hover{ background:var(--accent-hover); }
.nav-item svg{ width:18px; height:18px; flex-shrink:0; stroke:currentColor; }
.nav-item .nav-label{
  font-size:var(--text-sm); letter-spacing:0.06em; text-transform:uppercase;
  opacity:0; max-width:0; overflow:hidden;
  transition:opacity var(--dur-normal) var(--ease) var(--dur-fast);
}
.sidebar:hover .nav-label, .sidebar:focus-within .nav-label{ opacity:1; max-width:140px; }

.main{
  flex:1; min-width:0;
  display:flex; justify-content:center;
}
.main-inner{
  width:100%; max-width:1180px;
  display:flex; flex-direction:column;
  padding:var(--sp-8) var(--sp-10) var(--sp-6);
}

/* ---- header: greeting / clock ---- */
.topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-6); margin-bottom:var(--sp-2); }
.greeting-block{ flex:1; min-width:0; }
.greeting{ font-size:var(--text-xl); font-weight:600; color:var(--text-primary); line-height:1.3; }
.greeting-sub{ font-size:var(--text-base); color:var(--text-muted); margin-top:var(--sp-1); }

.topbar-right{ display:flex; align-items:center; gap:var(--sp-4); flex-shrink:0; }

.clock{ text-align:right; }
.clock .time{ font-family:var(--font-body); font-weight:600; font-size:25px; font-variant-numeric:tabular-nums; letter-spacing:0.08em; color:var(--text-primary); line-height:1; }
.clock .date{ font-family:var(--font-body); font-weight:500; font-size:var(--text-xs); letter-spacing:0.16em; color:var(--text-muted); margin-top:5px; text-transform:uppercase; }

/* ---- search ---- */
.search-wrap{ margin:var(--sp-6) 0 var(--sp-8); max-width:640px; }
.is-hidden{ display:none; }
.search-bar{
  display:flex; align-items:center; gap:var(--sp-3);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-full);
  padding:13px 20px;
  transition:border-color var(--dur-normal) var(--ease), box-shadow var(--dur-normal) var(--ease);
}
.search-bar:focus-within{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.search-bar svg.search-icon{ width:15px; height:15px; stroke:var(--accent); flex-shrink:0; }
.search-bar input{ flex:1; background:none; border:none; outline:none; font-size:var(--text-md); color:var(--text-primary); }
.search-bar input::placeholder{ color:var(--text-muted); }
.mic-search-btn{
  width:26px; height:26px; border-radius:var(--r-full); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:var(--text-muted);
  transition:all var(--dur-fast) var(--ease);
}
.mic-search-btn:hover{ background:var(--hover-overlay); color:var(--text-primary); }
.mic-search-btn.listening{ background:var(--accent); color:#fff; animation:pulse 1.2s infinite; }
.mic-search-btn svg{ width:14px; height:14px; stroke:currentColor; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 var(--accent-soft-strong);} 70%{box-shadow:0 0 0 9px rgba(255,42,31,0);} 100%{box-shadow:0 0 0 0 rgba(255,42,31,0);} }

/* =========================================================================
   HOME — SECTIONED HIERARCHY
   greeting -> search -> current work -> important -> up next -> recent
   ========================================================================= */
.section{ margin-bottom:var(--sp-8); animation:fadeUp .32s var(--ease); }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
.section-label{
  font-size:var(--text-xs); letter-spacing:var(--tracking-label); text-transform:uppercase;
  color:var(--text-muted); margin-bottom:var(--sp-3); font-weight:600;
}
.section-label-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-3); }
.section-label-row .section-label{ margin-bottom:0; }
.section-link{ font-size:var(--text-xs); letter-spacing:0.05em; color:var(--text-muted); transition:color var(--dur-fast) var(--ease); }
.section-link:hover{ color:var(--accent); }

.important-row{
  display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-2) var(--sp-1);
  cursor:pointer; border-radius:var(--r-sm); transition:background var(--dur-fast) var(--ease);
}
.important-row:hover{ background:var(--hover-overlay); }
.important-star{ color:var(--accent); flex-shrink:0; display:flex; }
.important-star svg{ width:14px; height:14px; fill:currentColor; }
.important-row-title{ font-size:var(--text-base); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.important-row-sub{ font-size:var(--text-xs); color:var(--text-muted); margin-top:2px; }

.list-subheading{
  font-size:var(--text-xs); letter-spacing:var(--tracking-label); text-transform:uppercase;
  color:var(--text-muted); margin:var(--sp-2) 0 -2px;
}
.star-btn{ opacity:0; transition:opacity var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.item-card:hover .star-btn, .checklist-card:hover .star-btn{ opacity:1; }
.star-btn.starred{ opacity:1; color:var(--accent); }
.star-btn:hover{ transform:scale(1.15); color:var(--accent); }
.star-btn svg{ fill:none; }
.star-btn.starred svg{ fill:currentColor; }

.spotlight-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-5) var(--sp-6); cursor:pointer; position:relative;
  display:flex; align-items:center; gap:var(--sp-4);
  transition:transform var(--dur-normal) var(--ease), border-color var(--dur-normal) var(--ease), box-shadow var(--dur-normal) var(--ease);
}
.spotlight-card:hover{ transform:translateY(-2px); border-color:#38383a; box-shadow:var(--shadow-hover); }
.spotlight-type{ font-size:var(--text-xs); letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
.spotlight-title{ font-size:var(--text-lg); font-weight:600; padding-right:var(--sp-6); }
.spotlight-snippet{ font-size:var(--text-base); color:var(--text-secondary); margin-top:4px; max-width:60ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.spotlight-arrow{ position:absolute; top:var(--sp-4); right:var(--sp-5); color:var(--text-muted); font-size:16px; flex-shrink:0; transition:transform var(--dur-fast) var(--ease); }
.spotlight-card:hover .spotlight-arrow{ transform:translateX(3px); color:var(--text-primary); }

.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); }
@media (max-width:760px){ .two-col{ grid-template-columns:1fr; } }

.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  overflow:hidden;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--sp-3) var(--sp-4); cursor:pointer;
  border-bottom:1px solid var(--divider);
  transition:background var(--dur-fast) var(--ease);
}
.panel-head:hover{ background:var(--hover-overlay); }
.panel-head h2{ margin:0; font-size:var(--text-xs); letter-spacing:var(--tracking-label); text-transform:uppercase; color:var(--text-secondary); font-weight:600; }
.panel-head .chev{ color:var(--text-muted); font-size:12px; transition:transform var(--dur-fast) var(--ease); }
.panel-head:hover .chev{ transform:translateX(3px); }
.panel-body{ padding:var(--sp-3); display:flex; flex-direction:column; gap:var(--sp-2); max-height:260px; overflow-y:auto; }

.empty-hint{
  color:var(--text-muted); font-size:var(--text-base); padding:var(--sp-6) var(--sp-3);
  text-align:center; display:flex; flex-direction:column; gap:var(--sp-3); align-items:center;
}
.empty-hint button{
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-soft-strong);
  padding:7px 14px; border-radius:var(--r-md); font-size:var(--text-sm); letter-spacing:0.05em;
  transition:background var(--dur-fast) var(--ease);
}
.empty-hint button:hover{ background:var(--accent-soft-strong); }

/* voice rows */
.voice-row{
  display:flex; align-items:center; gap:var(--sp-3);
  background:var(--surface-elevated); border:1px solid var(--divider); border-radius:var(--r-sm);
  padding:var(--sp-2) var(--sp-3);
  transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.voice-row:hover{ border-color:var(--border); transform:translateX(1px); }
.play-btn{
  width:26px; height:26px; border-radius:var(--r-full); flex-shrink:0;
  background:var(--border); display:flex; align-items:center; justify-content:center;
  transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.play-btn:hover{ background:var(--accent); }
.play-btn:active{ transform:scale(0.9); }
.play-btn svg{ width:11px; height:11px; stroke:currentColor; fill:currentColor; }
.voice-meta{ flex:1; min-width:0; cursor:pointer; }
.voice-title{ font-size:var(--text-base); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.voice-time{ font-size:var(--text-xs); color:var(--text-muted); margin-top:2px; }
.voice-ai{ font-size:var(--text-xs); color:var(--accent); margin-top:2px; font-style:italic; }

/* thumbs */
.thumb-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-2); }
.thumb{
  position:relative; aspect-ratio:1/1; border-radius:var(--r-sm); overflow:hidden;
  background-size:cover; background-position:center; border:1px solid var(--divider);
  cursor:pointer; transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.thumb:hover{ transform:scale(1.03); border-color:var(--accent); }
.thumb .thumb-tag{
  position:absolute; bottom:0; left:0; right:0; padding:4px 6px;
  font-size:9px; color:#fff; background:linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* checklist rows */
.check-row{
  display:flex; align-items:flex-start; gap:var(--sp-2); padding:6px 4px;
  cursor:pointer; border-radius:var(--r-sm); transition:background var(--dur-fast) var(--ease);
}
.check-row:hover{ background:var(--hover-overlay); }
.checkbox{
  width:15px; height:15px; border-radius:4px; border:1.5px solid var(--text-muted);
  flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
  transition:all var(--dur-normal) var(--ease); background:transparent;
}
.checkbox svg{ width:9px; height:9px; stroke:#fff; stroke-width:3; opacity:0; transform:scale(0.5); transition:all var(--dur-fast) var(--ease); }
.check-row.checked .checkbox{ background:var(--success); border-color:var(--success); }
.check-row.checked .checkbox svg{ opacity:1; transform:scale(1); }
.check-row span.item-text{ font-size:var(--text-base); transition:all var(--dur-normal) var(--ease); }
.check-row.checked span.item-text{ color:var(--text-muted); text-decoration:line-through; }
.checklist-title-mini{ font-size:var(--text-xs); color:var(--text-secondary); letter-spacing:0.05em; margin-bottom:4px; text-transform:uppercase; }

.quick-actions{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:var(--sp-3); }
.quick-action-btn{
  display:flex; align-items:center; gap:var(--sp-3);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4); text-align:left;
  transition:transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.quick-action-btn:hover{ transform:translateY(-2px); border-color:var(--accent); background:var(--surface-elevated); }
.quick-action-btn .qa-icon{
  width:32px; height:32px; flex-shrink:0; border-radius:var(--r-sm); background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
}
.quick-action-btn .qa-icon svg{ width:15px; height:15px; stroke:currentColor; }
.quick-action-btn .qa-label{ font-size:var(--text-sm); letter-spacing:0.02em; color:var(--text-primary); }

.everything-else{ text-align:center; padding-top:var(--sp-2); }
.everything-else button{
  color:var(--text-muted); font-size:var(--text-sm); letter-spacing:0.05em;
  padding:8px 4px; transition:color var(--dur-fast) var(--ease);
}
.everything-else button:hover{ color:var(--text-primary); }

/* =========================================================================
   LIST VIEWS (all-voice / all-visual / all-checklists / files / search)
   ========================================================================= */
.view-head{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-5); }
.back-btn{
  width:32px; height:32px; border-radius:var(--r-sm); background:var(--surface); border:1px solid var(--border);
  color:var(--text-secondary); display:flex; align-items:center; justify-content:center;
  transition:all var(--dur-fast) var(--ease);
}
.back-btn:hover{ color:var(--text-primary); border-color:#3a3a3a; }
.back-btn svg{ width:15px; height:15px; stroke:currentColor; }
.view-title{ font-size:var(--text-sm); letter-spacing:0.16em; text-transform:uppercase; color:var(--text-secondary); flex:1; }
.new-btn{
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-soft-strong);
  padding:8px 14px; border-radius:var(--r-md); font-size:var(--text-sm); letter-spacing:0.05em;
  display:flex; gap:6px; align-items:center; transition:background var(--dur-fast) var(--ease);
}
.new-btn:hover{ background:var(--accent-soft-strong); }
.new-btn svg{ width:13px; height:13px; stroke:currentColor; }

.list-col{ display:flex; flex-direction:column; gap:var(--sp-3); }
.item-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4);
  display:flex; flex-direction:column; gap:var(--sp-2);
  transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.item-card:hover{ border-color:#38383a; }
.item-card-head{ display:flex; align-items:center; gap:var(--sp-3); }
.type-pill{
  font-size:9px; letter-spacing:0.08em; text-transform:uppercase; padding:3px 8px; border-radius:var(--r-full);
  background:var(--surface-elevated); color:var(--text-secondary); border:1px solid var(--divider); flex-shrink:0;
}
.item-card-title{ font-size:var(--text-base); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.item-card-title:hover{ color:var(--accent); }
.item-card-time{ font-size:var(--text-xs); color:var(--text-muted); flex-shrink:0; }
.icon-btn-sm{
  width:26px; height:26px; border-radius:var(--r-sm); color:var(--text-muted);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all var(--dur-fast) var(--ease);
}
.icon-btn-sm:hover{ background:var(--hover-overlay); color:var(--accent); }
.icon-btn-sm svg{ width:13px; height:13px; stroke:currentColor; }
.item-card-body{ font-size:var(--text-base); color:var(--text-secondary); line-height:var(--leading); }
.item-photos-row{ display:flex; gap:6px; flex-wrap:wrap; }
.item-photos-row .mini-thumb{ width:52px; height:52px; border-radius:var(--r-sm); background-size:cover; background-position:center; border:1px solid var(--divider); cursor:pointer; }

.visual-full-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:var(--sp-3); }
.visual-full-grid .list-subheading{ grid-column:1/-1; }
.visual-full-item{
  border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface); cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.visual-full-item:hover{ border-color:var(--accent); transform:translateY(-2px); }
.visual-full-item .img{ width:100%; aspect-ratio:4/3; background-size:cover; background-position:center; position:relative; cursor:pointer; }
.visual-full-item .cap{ padding:8px 9px; font-size:var(--text-xs); color:var(--text-secondary); line-height:1.4; max-height:52px; overflow:hidden; cursor:pointer; }
.visual-full-item .img .star-btn{
  position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.5); color:#fff; border-radius:var(--r-sm);
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;
}
.visual-full-item .img .star-btn:hover{ background:rgba(0,0,0,0.7); }
.visual-full-item .img .star-btn.starred{ color:var(--accent); }

.checklist-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp-4); }
.checklist-card-head{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-2); }
.checklist-card-head h3{ margin:0; font-size:var(--text-base); flex:1; }
.checklist-progress{ font-size:var(--text-xs); color:var(--text-muted); }

/* =========================================================================
   SETTINGS & APPEARANCE
   ========================================================================= */
.settings-title{ font-size:var(--text-xl); font-weight:600; margin-bottom:var(--sp-1); }
.settings-sub{ font-size:var(--text-base); color:var(--text-muted); margin-bottom:var(--sp-8); }
.settings-section{ max-width:640px; margin-bottom:var(--sp-8); padding-top:var(--sp-8); border-top:1px solid var(--divider); }
.settings-section:first-of-type{ padding-top:0; border-top:none; }
.settings-section-title{ font-size:var(--text-xs); letter-spacing:var(--tracking-label); text-transform:uppercase; color:var(--text-muted); margin-bottom:var(--sp-4); }

.mode-toggle-row{ display:flex; gap:var(--sp-3); }
.mode-btn{
  flex:1; padding:var(--sp-3) var(--sp-4); border-radius:var(--r-md); border:1px solid var(--border);
  background:var(--surface); color:var(--text-secondary); font-size:var(--text-sm); letter-spacing:0.04em;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:all var(--dur-fast) var(--ease);
}
.mode-btn:hover{ color:var(--text-primary); border-color:#3a3a3a; }
.mode-btn.active{ border-color:var(--accent); color:var(--text-primary); background:var(--accent-soft); }

.accent-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:var(--sp-1); margin-bottom:var(--sp-5); }
.accent-swatch{
  display:flex; flex-direction:column; align-items:center; gap:7px;
  padding:var(--sp-3) var(--sp-2); border-radius:var(--r-md); border:1px solid transparent; cursor:pointer;
  transition:background var(--dur-fast) var(--ease);
}
.accent-swatch:hover{ background:var(--hover-overlay); }
.accent-swatch.active{ background:var(--hover-overlay); }
.accent-dot{ width:26px; height:26px; border-radius:var(--r-full); border:2px solid var(--divider); box-shadow:0 0 0 1px rgba(255,255,255,0.06); position:relative; flex-shrink:0; }
.accent-swatch.active .accent-dot::after{ content:''; position:absolute; inset:-5px; border-radius:var(--r-full); border:1.5px solid var(--text-primary); }
.accent-swatch-name{ font-size:9.5px; color:var(--text-muted); letter-spacing:0.02em; text-align:center; line-height:1.2; }
.custom-accent-row{ display:flex; align-items:center; gap:var(--sp-3); }
.color-picker-input{ width:36px; height:36px; border-radius:var(--r-full); border:2px solid var(--border); background:none; cursor:pointer; padding:0; flex-shrink:0; }
.color-picker-input::-webkit-color-swatch-wrapper{ padding:0; }
.color-picker-input::-webkit-color-swatch{ border:none; border-radius:var(--r-full); }

.settings-list{ display:flex; flex-direction:column; }
.settings-row{
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
  padding:var(--sp-4) 2px; border-bottom:1px solid var(--divider);
}
.settings-row-label{ font-size:var(--text-md); }
.settings-row-desc{ font-size:var(--text-sm); color:var(--text-muted); margin-top:2px; }
.settings-row-value{ font-size:var(--text-sm); color:var(--text-muted); }
.toggle{
  width:38px; height:22px; border-radius:var(--r-full); background:var(--border); position:relative; flex-shrink:0;
  transition:background var(--dur-normal) var(--ease);
}
.toggle::after{
  content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:var(--r-full); background:#e8e8e6;
  transition:transform var(--dur-normal) var(--ease);
}
.toggle.on{ background:var(--accent); }
.toggle.on::after{ transform:translateX(16px); }

/* =========================================================================
   MODALS (note / voice / screenshot / checklist / detail)
   ========================================================================= */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:100;
  animation:fadeIn var(--dur-fast) var(--ease);
}
.modal-box{
  width:460px; max-width:92vw; max-height:86vh; overflow-y:auto;
  background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-6); animation:slideUp var(--dur-normal) var(--ease);
}
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-5); }
.modal-head h3{ margin:0; font-size:var(--text-sm); letter-spacing:0.16em; text-transform:uppercase; }
.modal-close{ width:26px; height:26px; border-radius:var(--r-sm); color:var(--text-muted); display:flex; align-items:center; justify-content:center; }
.modal-close:hover{ background:var(--hover-overlay); color:var(--text-primary); }
.modal-close svg{ width:14px; height:14px; stroke:currentColor; }

.field{ margin-bottom:var(--sp-4); }
.field-label{ font-size:var(--text-xs); letter-spacing:0.1em; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px; display:block; }
.text-input, .text-area{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:10px 12px; color:var(--text-primary); font-size:var(--text-md); transition:border-color var(--dur-fast) var(--ease);
}
.text-input:focus, .text-area:focus{ outline:none; border-color:var(--accent); }
.text-area{ resize:vertical; min-height:80px; line-height:var(--leading); }

.row-flex{ display:flex; gap:var(--sp-3); align-items:center; }
.ghost-btn{
  background:var(--surface); border:1px solid var(--border); color:var(--text-secondary);
  padding:9px 14px; border-radius:var(--r-sm); font-size:var(--text-sm); letter-spacing:0.04em;
  display:flex; align-items:center; gap:7px; transition:all var(--dur-fast) var(--ease);
}
.ghost-btn:hover{ border-color:#3a3a3a; color:var(--text-primary); }
.ghost-btn svg{ width:14px; height:14px; stroke:currentColor; }
.ghost-btn.rec-active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

.primary-btn{
  background:var(--accent); border:none; color:#fff; padding:10px 18px; border-radius:var(--r-sm);
  font-size:var(--text-sm); letter-spacing:0.05em; font-weight:600;
  transition:background var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
.primary-btn:hover{ background:var(--accent-hover); }
.primary-btn:disabled{ opacity:0.4; cursor:not-allowed; }
.modal-actions{ display:flex; justify-content:flex-end; gap:var(--sp-3); margin-top:var(--sp-2); }

.photo-strip{ display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3); }
.photo-chip{ position:relative; width:64px; height:64px; border-radius:var(--r-sm); overflow:hidden; background-size:cover; background-position:center; border:1px solid var(--divider); }
.photo-chip .rm{ position:absolute; top:2px; right:2px; width:16px; height:16px; background:rgba(0,0,0,0.7); border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff; }
.photo-chip .rm svg{ width:9px; height:9px; stroke:currentColor; }
.photo-chip .cap-status{ position:absolute; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; }
.spinner{ width:14px; height:14px; border:2px solid rgba(255,255,255,0.25); border-top-color:#fff; border-radius:var(--r-full); animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.rec-timer{ font-family:var(--font-display); font-size:var(--text-lg); color:var(--accent); }
.audio-preview{ width:100%; margin-top:var(--sp-2); filter:invert(1) grayscale(1) contrast(1.15); border-radius:var(--r-sm); }

.capture-area{
  width:100%; min-height:130px; border:1.5px dashed var(--border); border-radius:var(--r-md);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--sp-3);
  background:var(--surface); position:relative; overflow:hidden;
}
.capture-area img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.capture-hint{ font-size:var(--text-sm); color:var(--text-muted); }

.item-modal-detail{ font-size:var(--text-base); color:var(--text-secondary); line-height:var(--leading); white-space:pre-wrap; }
.lightbox-img{ width:100%; border-radius:var(--r-md); margin-bottom:var(--sp-3); max-height:340px; object-fit:contain; background:#000; }
.checklist-editor-row{ display:flex; gap:var(--sp-2); align-items:center; margin-bottom:var(--sp-2); }

.ai-summary-label{ font-size:var(--text-xs); color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; margin:var(--sp-3) 0 6px; }
.ai-summary-list{ list-style:none; display:flex; flex-direction:column; gap:5px; padding:0; margin:0; }
.ai-summary-list li{ font-size:var(--text-base); color:var(--text-secondary); display:flex; gap:7px; }
.ai-summary-list li::before{ content:"•"; color:var(--accent); }
.ai-loading{ font-size:var(--text-sm); color:var(--accent); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulseText{ 0%,100%{opacity:1;} 50%{opacity:.5;} }
.ai-loading{ animation-name:pulseText; }

.toast{
  position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
  background:var(--surface-elevated); border:1px solid var(--border); color:var(--text-primary);
  padding:11px 20px; border-radius:var(--r-md); font-size:var(--text-sm); z-index:200; animation:fadeIn var(--dur-fast) var(--ease);
  box-shadow:var(--shadow-hover);
}

/* =========================================================================
   INVERT COLORS (toggled from Settings, or by clicking the logo mark)
   ========================================================================= */
/* Foundation + accent tinting is applied via CSS custom properties in JS
   (see applyAppearance) rather than a blunt filter, so no filter rule is
   needed here — html.tinted is kept as a hook for any future refinements. */

/* =========================================================================
   RESPONSIVE
   ========================================================================= */
@media (max-width:900px){
  .main-inner{ padding:var(--sp-6) var(--sp-5); }
  .home-grid{ grid-template-columns:1fr; }
}
@media (max-width:600px){
  :root{ --rail-w:56px; --sidebar-w-expanded:190px; }
  .main-inner{ padding:var(--sp-5) var(--sp-4); }
  .topbar{ flex-direction:column; gap:var(--sp-3); }
  .clock{ text-align:left; }
  .accent-grid{ grid-template-columns:repeat(4,1fr); }
}
</style>

  };

  /* ============ STATE ============ */
  const state = {
    data: { entries: [], checklists: [] },
    view: 'home',
    prevView: 'home',
    searchQuery: '',
    playingId: null,
    currentAudio: null,
    modal: null,
    draft: {},
  };

  const $ = sel => document.querySelector(sel);
  const viewContainer = $('#view-container');
  const modalRoot = $('#modal-root');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(str){
    if(str===undefined||str===null) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtTime(iso){
    const d = new Date(iso);
    const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
    return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()} · ${hh}:${mm}`;
  }
  function showToast(msg){
    const el = document.createElement('div');
    el.className='toast';
    el.textContent = msg;
    $('#toast-root').appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }

  /* ============ STORAGE ============ */
  async function loadData(){
    try{
      const res = await window.storage.get('essential-space-data', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state.data.entries = parsed.entries || [];
        state.data.checklists = parsed.checklists || [];
      }
    }catch(e){ /* nothing saved yet */ }
  }
  async function saveData(){
    try{ await window.storage.set('essential-space-data', JSON.stringify(state.data), false); return true; }
    catch(e){ console.error('save failed', e); return false; }
  }

  /* ============ APPEARANCE ENGINE (mode x accent, independent axes) ============ */
  const APPEARANCE_KEY = 'thinksync-appearance';
  const LEGACY_THEME_KEY = 'essential-space-theme';
  const MODES = {
    dark:  { bg:'#0a0a0b', bgSecondary:'#050506', surface:'#141416', surfaceEl:'#1c1c1f', border:'#242426', divider:'#1b1b1d', text:'#f2f2f0', textSec:'#9a9a97', textMuted:'#5c5c59' },
    light: { bg:'#f4f2ee', bgSecondary:'#eae7e1', surface:'#ffffff', surfaceEl:'#f1efea', border:'#ddd8cf', divider:'#e6e2da', text:'#1a1917', textSec:'#5c584f', textMuted:'#8b8579' },
  };
  const ACCENTS = [
    { id:'nothing-red', name:'Nothing Red', accent:'#ff2a1f', accentHover:'#ff4438' },
    { id:'ocean-blue', name:'Ocean Blue', accent:'#2ea6ff', accentHover:'#57b8ff' },
    { id:'matte-green', name:'Matte Green', accent:'#3fae6a', accentHover:'#59c684' },
    { id:'purple', name:'Purple', accent:'#8a5cf6', accentHover:'#a17cf8' },
    { id:'amber', name:'Amber', accent:'#ffb020', accentHover:'#ffc352' },
    { id:'slate', name:'Slate', accent:'#7c8a9c', accentHover:'#93a0b0' },
    { id:'graphite', name:'Graphite', accent:'#9a9a97', accentHover:'#b3b3b0' },
    { id:'rose', name:'Rose', accent:'#f65c8a', accentHover:'#f97ea3' },
    { id:'arctic-cyan', name:'Arctic Cyan', accent:'#38e0ff', accentHover:'#69e8ff' },
    { id:'emerald', name:'Emerald', accent:'#1fbf83', accentHover:'#38d69a' },
    { id:'white', name:'White', accent:'#f2f2f0', accentHover:'#d8d8d5' },
    { id:'black', name:'Black', accent:'#0a0a0a', accentHover:'#242424' },
  ];
  let appearance = { mode:'dark', accentId:'nothing-red', customColor:'#ff2a1f', tinted:false, reducedMotion:false, highContrast:false };

  function hexToRgba(hex, a){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function shade(hex, amt){
    const h = hex.replace('#','');
    let r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
    r=Math.min(255,Math.round(r+(255-r)*amt)); g=Math.min(255,Math.round(g+(255-g)*amt)); b=Math.min(255,Math.round(b+(255-b)*amt));
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function mixHex(hexA, hexB, t){
    const a = hexA.replace('#',''), b = hexB.replace('#','');
    const ar=parseInt(a.substring(0,2),16), ag=parseInt(a.substring(2,4),16), ab=parseInt(a.substring(4,6),16);
    const br=parseInt(b.substring(0,2),16), bg=parseInt(b.substring(2,4),16), bb=parseInt(b.substring(4,6),16);
    const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
    return '#'+[r,g,bl].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
  }

  function applyAppearance(save){
    const m = MODES[appearance.mode] || MODES.dark;
    const accentDef = appearance.accentId==='custom'
      ? { accent: appearance.customColor||'#ff2a1f', accentHover: shade(appearance.customColor||'#ff2a1f', 0.18) }
      : (ACCENTS.find(a=>a.id===appearance.accentId) || ACCENTS[0]);

    let bg, bgSecondary, surface, surfaceEl, border, divider, accentOut, accentHoverOut;

    if(appearance.tinted){
      /* Wash the whole foundation (backgrounds, surfaces, borders) in the chosen
         accent color. The pop color used for buttons/highlights flips to the
         contrasting neutral (white on dark mode, near-black on light mode) so
         it still reads clearly against the tinted foundation. */
      const base = appearance.mode==='dark' ? '#000000' : '#ffffff';
      const pop  = appearance.mode==='dark' ? '#f5f5f2' : '#15140f';
      bg           = mixHex(accentDef.accent, base, 0.88);
      bgSecondary  = mixHex(accentDef.accent, base, 0.93);
      surface      = mixHex(accentDef.accent, base, 0.80);
      surfaceEl    = mixHex(accentDef.accent, base, 0.71);
      border       = mixHex(accentDef.accent, base, 0.55);
      divider      = mixHex(accentDef.accent, base, 0.68);
      accentOut      = pop;
      accentHoverOut = mixHex(pop, base, 0.14);
    } else {
      bg = m.bg; bgSecondary = m.bgSecondary; surface = m.surface; surfaceEl = m.surfaceEl;
      border = m.border; divider = m.divider;
      accentOut = accentDef.accent; accentHoverOut = accentDef.accentHover;
    }

    if(appearance.highContrast){
      border  = appearance.mode==='light' ? '#a39d8f' : '#4a4a4a';
      divider = appearance.mode==='light' ? '#a39d8f' : '#3a3a3a';
    }

    const root = document.documentElement.style;
    root.setProperty('--bg', bg);
    root.setProperty('--bg-secondary', bgSecondary);
    root.setProperty('--surface', surface);
    root.setProperty('--surface-elevated', surfaceEl);
    root.setProperty('--border', border);
    root.setProperty('--divider', divider);
    root.setProperty('--text-primary', m.text);
    root.setProperty('--text-secondary', appearance.highContrast ? m.text : m.textSec);
    root.setProperty('--text-muted', appearance.highContrast ? (appearance.mode==='light' ? '#3a3833' : '#c8c8c5') : m.textMuted);
    root.setProperty('--accent', accentOut);
    root.setProperty('--accent-hover', accentHoverOut);
    root.setProperty('--accent-soft', hexToRgba(accentOut, 0.14));
    root.setProperty('--accent-soft-strong', hexToRgba(accentOut, 0.28));
    root.setProperty('--focus-ring', hexToRgba(accentOut, 0.55));
    root.setProperty('--selection', hexToRgba(accentOut, 0.28));
    document.documentElement.classList.toggle('tinted', !!appearance.tinted);
    document.body.style.setProperty('--dur-fast', appearance.reducedMotion ? '0ms' : '120ms');
    document.body.style.setProperty('--dur-normal', appearance.reducedMotion ? '0ms' : '200ms');
    document.body.style.setProperty('--dur-slow', appearance.reducedMotion ? '0ms' : '320ms');
    document.body.style.setProperty('--dur-theme', appearance.reducedMotion ? '0ms' : '340ms');
    if(state.view==='settings') renderSettings();
    if(save){ window.storage.set(APPEARANCE_KEY, JSON.stringify(appearance), false).catch(()=>{}); }
  }

  async function loadTheme(){
    try{
      const res = await window.storage.get(APPEARANCE_KEY, false);
      if(res && res.value){
        appearance = Object.assign(appearance, JSON.parse(res.value));
        if(appearance.invert !== undefined && appearance.tinted === undefined){
          appearance.tinted = appearance.invert;
        }
        delete appearance.invert;
        applyAppearance(false);
        return;
      }
    }catch(e){ /* fall through to legacy */ }
    try{
      const legacy = await window.storage.get(LEGACY_THEME_KEY, false);
      if(legacy && legacy.value){
        const id = JSON.parse(legacy.value);
        const map = { 'nothing-red':'nothing-red', 'ocean-blue':'ocean-blue', 'matrix-green':'matte-green', 'amber-terminal':'amber', 'violet-neon':'purple' };
        appearance.mode = id==='paper-light' ? 'light' : 'dark';
        appearance.accentId = map[id] || 'nothing-red';
      }
    }catch(e){ /* use defaults */ }
    applyAppearance(false);
  }

  /* ============ CLOCK & GREETING ============ */
  function updateClock(){
    const now = new Date();
    const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    $('#clock-time').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    $('#clock-date').textContent = days[now.getDay()]+', '+months[now.getMonth()]+' '+now.getDate();
  }
  function updateGreeting(){
    const h = new Date().getHours();
    const word = h<5 ? 'Good night.' : h<12 ? 'Good morning.' : h<17 ? 'Good afternoon.' : h<21 ? 'Good evening.' : 'Good night.';
    $('#greeting-text').textContent = word;
    const openItems = state.data.checklists.reduce((n,c)=> n + c.items.filter(i=>!i.checked).length, 0);
    const sub = $('#greeting-sub');
    if(openItems){
      sub.textContent = `${openItems} thing${openItems===1?'':'s'} still open.`;
      sub.classList.remove('is-hidden');
    } else {
      sub.textContent = '';
      sub.classList.add('is-hidden');
    }
  }

  /* ============ DATA HELPERS ============ */
  function allEntries(){ return [...state.data.entries].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)); }
  function allChecklists(){ return [...state.data.checklists].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)); }
  function splitImportant(list, isImportantFn){
    const test = isImportantFn || (x=>x.important);
    return { imp: list.filter(test), rest: list.filter(x=>!test(x)) };
  }
  function importantFirstHtml(list, cardFn, isImportantFn){
    const { imp, rest } = splitImportant(list, isImportantFn);
    let out = '';
    if(imp.length){ out += `<div class="list-subheading">Important</div>` + imp.map(cardFn).join(''); }
    if(imp.length && rest.length){ out += `<div class="list-subheading">Recent</div>`; }
    out += rest.map(cardFn).join('');
    return out;
  }
  function findEntry(id){ return state.data.entries.find(e=>e.id===id); }
  function findChecklist(id){ return state.data.checklists.find(c=>c.id===id); }
  function allPhotosFlat(){
    const out=[];
    allEntries().forEach(e=>{ (e.photos||[]).forEach(p=> out.push({ photo:p, entry:e })); });
    return out;
  }
  function matchesEntry(e, q){
    if(!q) return true;
    q=q.toLowerCase();
    if(e.title && e.title.toLowerCase().includes(q)) return true;
    if(e.text && e.text.toLowerCase().includes(q)) return true;
    if(e.photos && e.photos.some(p=>p.caption && p.caption.toLowerCase().includes(q))) return true;
    if(e.summaryLines && e.summaryLines.some(l=>l.toLowerCase().includes(q))) return true;
    return false;
  }
  function matchesChecklist(c, q){
    if(!q) return true;
    q=q.toLowerCase();
    if(c.title && c.title.toLowerCase().includes(q)) return true;
    return c.items.some(it=>it.text.toLowerCase().includes(q));
  }

  /* ============ ROUTER ============ */
  function setView(v){
    state.view = v;
    document.querySelectorAll('.nav-item[data-view]').forEach(b=>{
      b.classList.toggle('active', b.dataset.view===v);
    });
    render();
  }

  const SEARCH_PLACEHOLDERS = {
    home: 'Search your mind...',
    important: 'Search important...',
    'all-notes': 'Search notes...',
    'all-voice': 'Search recordings...',
    'all-visual': 'Search screenshots...',
    'all-checklists': 'Search checklists...',
    files: 'Search files...',
    settings: 'Search settings...',
  };
  function updateSearchPlaceholder(){
    const input = $('#search-input');
    if(!input) return;
    const key = state.view==='search' ? (state.prevView||'home') : state.view;
    input.placeholder = SEARCH_PLACEHOLDERS[key] || 'Search your mind...';
  }

  function render(){
    updateSearchPlaceholder();
    if(state.view==='home') return renderHome();
    if(state.view==='important') return renderImportant();
    if(state.view==='all-notes') return renderAllNotes();
    if(state.view==='all-voice') return renderAllVoice();
    if(state.view==='all-visual') return renderAllVisual();
    if(state.view==='all-checklists') return renderAllChecklists();
    if(state.view==='files') return renderFiles();
    if(state.view==='search') return renderSearch();
    if(state.view==='settings') return renderSettings();
  }

  /* ---------- HOME ---------- */
  function renderHome(){
    updateGreeting();
    const entries = allEntries();
    const checklists = allChecklists();
    const continuing = entries[0];
    const pendingChecklists = checklists.slice(0,4);
    const voiceEntries = entries.filter(e=>e.type==='voice').slice(0,4);
    const photos = allPhotosFlat().slice(0,6);
    const importantItems = [...entries, ...checklists]
      .filter(x=>x.important)
      .sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt))
      .slice(0,4);

    let html = `
      <section class="section">
        <div class="section-label">Quick actions</div>
        <div class="quick-actions">
          <button class="quick-action-btn" data-open="note"><span class="qa-icon">${ICONS.note}</span><span class="qa-label">New note</span></button>
          <button class="quick-action-btn" data-open="voice"><span class="qa-icon">${ICONS.mic}</span><span class="qa-label">New voice note</span></button>
          <button class="quick-action-btn" data-open="screenshot"><span class="qa-icon">${ICONS.camera}</span><span class="qa-label">New screenshot</span></button>
          <button class="quick-action-btn" data-open="checklist"><span class="qa-icon">${ICONS.checklist}</span><span class="qa-label">New checklist</span></button>
        </div>
      </section>`;

    if(continuing){
      const kindLabel = {note:'Note', voice:'Voice note', screenshot:'Screenshot'}[continuing.type];
      const snippet = continuing.text || (continuing.photos && continuing.photos[0] && continuing.photos[0].caption) || (continuing.summaryLines && continuing.summaryLines[0]) || 'Open to see more';
      html += `
        <section class="section">
          <div class="section-label">Continue working</div>
          <div class="spotlight-card" data-detail="${continuing.id}">
            <div style="min-width:0;">
              <div class="spotlight-type">${kindLabel}</div>
              <div class="spotlight-title">${esc(continuing.title||'Untitled')}</div>
              <div class="spotlight-snippet">${esc(snippet)}</div>
            </div>
            <span class="spotlight-arrow">→</span>
          </div>
        </section>`;
    }

    if(importantItems.length){
      html += `
        <section class="section">
          <div class="section-label-row">
            <div class="section-label">Important</div>
            <button class="section-link" data-goto="important">See all →</button>
          </div>
          <div class="panel">
            <div class="panel-body" style="max-height:none;">
              ${importantItems.map(importantRowHtml).join('')}
            </div>
          </div>
        </section>`;
    }

    if(pendingChecklists.length){
      html += `
        <section class="section">
          <div class="section-label-row">
            <div class="section-label">Checklists</div>
            <button class="section-link" data-goto="all-checklists">See all →</button>
          </div>
          <div class="panel">
            <div class="panel-body" style="max-height:none;">
              ${pendingChecklists.map(c=>`
                <div class="check-row" data-goto-checklist="${c.id}">
                  <span class="checkbox"></span>
                  <span class="item-text">${esc(c.title)} · ${c.items.filter(i=>i.checked).length}/${c.items.length}</span>
                </div>`).join('')}
            </div>
          </div>
        </section>`;
    }

    html += `
      <section class="section">
        <div class="section-label">Recent</div>
        <div class="two-col">
          <div class="panel">
            <header class="panel-head" data-goto="all-voice"><h2>Voice notes</h2><span class="chev">→</span></header>
            <div class="panel-body">
              ${voiceEntries.length ? voiceEntries.map(voiceRowHtml).join('') : emptyHint('No voice notes yet','voice')}
            </div>
          </div>
          <div class="panel">
            <header class="panel-head" data-goto="all-visual"><h2>Visual feed</h2><span class="chev">→</span></header>
            <div class="panel-body">
              ${photos.length ? `<div class="thumb-grid">${photos.map(p=>thumbHtml(p.photo,p.entry)).join('')}</div>` : emptyHint('No photos yet','screenshot')}
            </div>
          </div>
        </div>
      </section>

      <div class="everything-else">
        <button data-goto="files">See all →</button>
      </div>
    `;

    viewContainer.innerHTML = html;
    bindHomeEvents();
  }

  function emptyHint(msg, openType){
    return `<div class="empty-hint"><span>${esc(msg)}</span><button data-open="${openType}">+ Add one</button></div>`;
  }
  function voiceRowHtml(e){
    const isPlaying = state.playingId===e.id;
    const ai = e.summaryLines && e.summaryLines[0] ? `<div class="voice-ai">${esc(e.summaryLines[0])}</div>` : '';
    return `
      <div class="voice-row" data-entry-row="${e.id}">
        <button class="play-btn" data-play="${e.id}" aria-label="Play voice note">${isPlaying?ICONS.pause:ICONS.play}</button>
        <div class="voice-meta" data-detail="${e.id}">
          <div class="voice-title">${esc(e.title || 'Untitled voice note')}</div>
          <div class="voice-time">${fmtTime(e.createdAt)}</div>
          ${ai}
        </div>
      </div>`;
  }
  function thumbHtml(photo, entry){
    return `<div class="thumb" style="background-image:url('${photo.dataUrl}')" data-detail="${entry.id}">
      <div class="thumb-tag">${esc((photo.caption||'').slice(0,40))}</div>
    </div>`;
  }
  function checklistPreviewHtml(c){
    const items = c.items.slice(0,6);
    const done = c.items.filter(i=>i.checked).length;
    return `
      <div class="checklist-title-mini">${esc(c.title)} · ${done}/${c.items.length}</div>
      ${items.map(it=>checkRowHtml(c.id, it)).join('')}
    `;
  }
  function checkRowHtml(checklistId, item){
    return `
      <label class="check-row ${item.checked?'checked':''}" data-toggle-item="${checklistId}|${item.id}">
        <span class="checkbox">${ICONS.check}</span>
        <span class="item-text">${esc(item.text)}</span>
      </label>`;
  }
  function importantRowHtml(item){

      : (item.text || (item.photos && item.photos[0] && item.photos[0].caption) || (item.summaryLines && item.summaryLines[0]) || '');

      <div class="important-row" ${attr}>

        <div style="min-width:0;">
          <div class="important-row-title">${esc(item.title||'Untitled')}</div>

  /* ============ AUDIO PLAYBACK ============ */
  function togglePlay(id){
    const entry = findEntry(id);
    if(!entry || !entry.audio){ showToast('No audio for this note'); return; }
    if(state.currentAudio){ state.currentAudio.pause(); state.currentAudio=null; }
    if(state.playingId===id){ state.playingId=null; render(); return; }
    const audio = new Audio(entry.audio);
    audio.play().catch(()=>showToast('Could not play audio'));
    state.currentAudio = audio;
    state.playingId = id;
    audio.onended = ()=>{ state.playingId=null; render(); };
    render();
  }

  /* ============ CHECKLIST MUTATIONS ============ */
  async function toggleChecklistItem(checklistId, itemId){
    const c = findChecklist(checklistId);
    if(!c) return;
    const item = c.items.find(i=>i.id===itemId);
    if(!item) return;
    item.checked = !item.checked;
    render();
    await saveData();
  }
  async function toggleImportant(key){
    const [kind, id] = key.split('|');
    const item = kind==='checklist' ? findChecklist(id) : findEntry(id);
    if(!item) return;
    item.important = !item.important;
    render();
    await saveData();
  }
  async function deleteEntry(id){
    state.data.entries = state.data.entries.filter(e=>e.id!==id);
    await saveData();
    closeModal();
    render();
  }
  async function deleteChecklist(id){
    state.data.checklists = state.data.checklists.filter(c=>c.id!==id);
    await saveData();
    closeModal();
    render();
  }

  /* ============ DETAIL MODAL ============ */
  function openDetailModal(entryId){
    const e = findEntry(entryId);
    if(!e) return;
    const kindLabel = {note:'Note', voice:'Voice note', screenshot:'Screenshot'}[e.type];
    const aiBlock = e.summarizing
      ? `<div class="ai-loading">✨ Generating AI summary…</div>`
      : (e.summaryLines && e.summaryLines.length
        ? `<div class="ai-summary-label">AI summary</div><ul class="ai-summary-list">${e.summaryLines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`
        : (e.transcript ? `<div class="icon-btn-sm" style="width:auto;height:auto;padding:4px 8px;color:var(--accent);" data-resummarize="${e.id}">✨ Generate AI summary</div>` : ''));
    modalRoot.innerHTML = `
      <div class="modal-overlay" data-overlay-close role="dialog" aria-modal="true">
        <div class="modal-box">
          <div class="modal-head"><h3>${kindLabel}</h3><button class="modal-close" data-close aria-label="Close">${ICONS.close}</button></div>
          ${e.photos && e.photos.length ? e.photos.map(p=>`
            <img class="lightbox-img" src="${p.dataUrl}">
            <div class="item-modal-detail" style="margin-bottom:12px;color:var(--text-muted);font-style:italic;">${esc(p.caption||'')}</div>
          `).join('') : ''}
          ${e.audio ? `<audio class="audio-preview" controls src="${e.audio}"></audio>` : ''}
          <div style="margin-top:10px;">
            <div class="field-label">${esc(e.title||'Untitled')}</div>
            <div class="item-modal-detail">${esc(e.text||'')}</div>
            ${aiBlock}
            <div class="voice-time" style="margin-top:10px;">${fmtTime(e.createdAt)}</div>
          </div>
          <div class="modal-actions">
            <button class="ghost-btn" data-edit-entry="${e.id}">${ICONS.edit} Edit</button>
            <button class="ghost-btn" data-delete-entry="${e.id}">${ICONS.trash} Delete</button>
          </div>
        </div>
      </div>
    `;
    bindModalCommon();
    modalRoot.querySelector('[data-delete-entry]').addEventListener('click', ()=>deleteEntry(e.id));
    modalRoot.querySelector('[data-edit-entry]').addEventListener('click', ()=>openEditEntryModal(e.id));
    const rs = modalRoot.querySelector('[data-resummarize]');
    if(rs) rs.addEventListener('click', ()=> generateVoiceSummary(e));

  function bindModalCommon(){
    modalRoot.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click', closeModal));
    const overlay = modalRoot.querySelector('[data-overlay-close]');
    if(overlay) overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  }
  function closeModal(){
    stopAnyMediaStreams();
    modalRoot.innerHTML='';
    state.modal=null;
    state.draft={};
  }
  function stopAnyMediaStreams(){
    if(state.draft.recordingStream){ state.draft.recordingStream.getTracks().forEach(t=>t.stop()); }
    if(state.draft.recTimerHandle) clearInterval(state.draft.recTimerHandle);
  }

  /* ============ EDIT ENTRY MODAL ============ */
  function openEditEntryModal(entryId){
    const e = findEntry(entryId);
    if(!e) return;
    state.modal = 'edit-entry';
    state.draft = {
      id: e.id,
      type: e.type,
      title: e.title || '',
      text: e.text || '',
      audioDataUrl: e.audio || null,
      transcript: e.transcript || '',
      photos: (e.photos||[]).map(p=>({ id:p.id, dataUrl:p.dataUrl, caption:p.caption||'' })),
      recording:false,
    };
    renderEditEntryModal();
  }

  /* ============ AI: IMAGE CAPTIONS & VOICE SUMMARIES ============ */
  async function callClaude(contentBlocks, maxTokens){
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: maxTokens || 300,
        messages: [{ role: "user", content: contentBlocks }],
      })
    });
    if(!res.ok) throw new Error('AI request failed');
    const data = await res.json();
    return (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  }

  async function generateCaption(dataUrl){
    try{
      const match = dataUrl.match(/^data:(image\/[a-zA-Z+.-]+);base64,(.*)$/);
      if(!match) return 'Summary unavailable';
      const text = await callClaude([
        { type:'image', source:{ type:'base64', media_type:match[1], data:match[2] } },
        { type:'text', text:'In one short plain sentence (under 20 words), describe what is shown in this image so it can be found later by a search engine. Respond with only that sentence, nothing else.' }
      ], 1000);
      return text.trim() || 'Summary unavailable';
    }catch(e){
      console.error('caption generation failed', e);
      return 'Summary unavailable';
    }
  }

  async function summarizeTranscript(transcript){
    const text = await callClaude([
      { type:'text', text:`Summarize this voice note transcript into 2-4 short bullet points capturing the key ideas and any action items. One bullet per line, plain text, no dashes or asterisks, no preamble.\n\nTranscript:\n"""${transcript}"""` }
    ], 300);
    return text.split('\n').map(s=>s.replace(/^[-*•\d.\)]+\s*/,'').trim()).filter(Boolean).slice(0,5);
  }

  async function generateVoiceSummary(entry){
    entry.summarizing = true;
    render();
    try{
      entry.summaryLines = (entry.transcript && entry.transcript.trim())
        ? await summarizeTranscript(entry.transcript)
        : ['No speech detected — nothing to summarize.'];
    }catch(e){
      entry.summaryLines = ['AI summary failed — check your connection and try again.'];
    }
    entry.summarizing = false;
    await saveData();
    render();
  }

  let mediaRecorder=null, audioChunks=[];
  async function startRecording(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      state.draft.recordingStream = stream;
      audioChunks = [];
      liveTranscript = '';
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) audioChunks.push(e.data); };
      mediaRecorder.start();
      if(SpeechRecognitionAPI){
        recognizer = new SpeechRecognitionAPI();
        recognizer.continuous = true;
        recognizer.interimResults = false;
        recognizer.lang = 'en-US';
        recognizer.onresult = (e)=>{
          for(let i=e.resultIndex; i<e.results.length; i++){
            if(e.results[i].isFinal) liveTranscript += e.results[i][0].transcript + ' ';
          }
        };
        recognizer.onerror = ()=>{};
        try{ recognizer.start(); }catch(e){}
      }
      return true;
    }catch(e){
      console.error('mic error', e);
      return false;
    }
  }
  function stopRecording(){
    return new Promise(resolve=>{
      if(recognizer){ try{ recognizer.stop(); }catch(e){} }
      if(!mediaRecorder){ resolve(null); return; }
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(audioChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        if(state.draft.recordingStream) state.draft.recordingStream.getTracks().forEach(t=>t.stop());
        const reader = new FileReader();
        reader.onloadend = ()=> resolve(reader.result);
        reader.readAsDataURL(blob);
      };
      mediaRecorder.stop();
    });
  }

  async function captureScreen(){
    try{
      const stream = await navigator.mediaDevices.getDisplayMedia({video:true});
      const track = stream.getVideoTracks()[0];
      let dataUrl;
      if('ImageCapture' in window){
        const capture = new ImageCapture(track);
        const bitmap = await capture.grabFrame();
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width; canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap,0,0);
        dataUrl = canvas.toDataURL('image/png');
      } else {
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        await new Promise(r=>setTimeout(r,250));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video,0,0);
        dataUrl = canvas.toDataURL('image/png');
      }
      stream.getTracks().forEach(t=>t.stop());
      return dataUrl;
    }catch(e){
      console.error('screen capture failed', e);
      return null;
    }
  }

        if(inp) it.text = inp.value;
      });
      d.title = $('#cl-title').value;
    }
    modalRoot.querySelectorAll('[data-remove-item]').forEach(el=>{
      el.addEventListener('click', ()=>{
        syncItemsFromDom();
        d.items = d.items.filter(it=>it.id!==el.dataset.removeItem);
        renderChecklistModal();
      });
    });
    $('#cl-add-item').addEventListener('click', ()=>{
      syncItemsFromDom();
      d.items.push({id:uid(),text:''});
      renderChecklistModal();
      const inputs = modalRoot.querySelectorAll('[data-item-input]');
      if(inputs.length) inputs[inputs.length-1].focus();
    });
    $('#cl-save').addEventListener('click', async ()=>{
      syncItemsFromDom();
      const title = d.title.trim();
      const items = d.items.filter(it=>it.text.trim()).map(it=>({id:it.id, text:it.text.trim(), checked:false}));
      if(!title || !items.length){ showToast('Add a title and at least one step'); return; }
      const checklist = { id: d.id, title, items, createdAt: new Date().toISOString() };
      state.data.checklists.push(checklist);
      const ok = await saveData();
      if(!ok) showToast('Saved for this session (storage limit reached)');
      closeModal();
      setView('home');
    });
  }

  /* ============ SEARCH BAR ============ */
  const searchInput = $('#search-input');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim();
    if(q && state.view!=='search'){ state.prevView = state.view; }
    state.searchQuery = q;
    if(q){ state.view='search'; renderSearch(); }
    else { setView(state.prevView||'home'); }
  });

  let searchRecognizer = null, listening=false;
  const micBtn = $('#search-mic-btn');
  if(SpeechRecognitionAPI){
    searchRecognizer = new SpeechRecognitionAPI();
    searchRecognizer.continuous = false;
    searchRecognizer.interimResults = false;
    searchRecognizer.onresult = (e)=>{
      const transcript = e.results[0][0].transcript;
      searchInput.value = transcript;
      searchInput.dispatchEvent(new Event('input'));
    };
    searchRecognizer.onend = ()=>{ listening=false; micBtn.classList.remove('listening'); };
    searchRecognizer.onerror = ()=>{ listening=false; micBtn.classList.remove('listening'); };
  }
  micBtn.addEventListener('click', ()=>{
    if(!searchRecognizer){ showToast('Voice search is not supported in this browser'); return; }
    if(listening){ searchRecognizer.stop(); listening=false; micBtn.classList.remove('listening'); return; }
    try{ searchRecognizer.start(); listening=true; micBtn.classList.add('listening'); }catch(e){}
  });

  /* ============ SIDEBAR BINDINGS ============ */
  document.querySelectorAll('.nav-item[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      searchInput.value=''; state.searchQuery='';
      setView(btn.dataset.view);
      btn.blur();
    });
  });
  /* ============ LOGO INVERT EASTER EGG ============ */
  const logoMarkBtn = document.getElementById('logo-mark-btn');
  if(logoMarkBtn){
    const toggleInvert = ()=>{ appearance.tinted = !appearance.tinted; applyAppearance(true); };
    logoMarkBtn.addEventListener('click', toggleInvert);
    logoMarkBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleInvert(); } });
  }

  /* ============ INIT ============ */
  async function init(){
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(updateGreeting, 60000);
    await loadTheme();
    await loadData();
    render();
  }
  init();

})();
</script>
</body>
</html>
